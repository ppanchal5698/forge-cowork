services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_BASE: http://backend:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forge
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: forgelocal
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_started
      neo4j:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/forgelocal
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - ./graph:/seed:ro

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  # MiniStack (github.com/ministackorg/ministack) — single-port AWS emulation on 4566.
  # docker.sock mount enables real Lambda/ECS/RDS containers.
  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    volumes:
      - ./infra/ministack-init:/docker-entrypoint-initaws.d/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  neo4jdata:
  ollamadata:
